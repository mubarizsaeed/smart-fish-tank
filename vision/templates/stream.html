<!DOCTYPE html>
<!--
  Reference stream page for main.py. The live version on the CYPHER stream Pi
  carries the lab's own styling and logo asset; this is a clean, self-contained
  template so the repo runs on its own. Drop the Cypher logo at
  static/images/Cypher.jpg (or edit the <img> below).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYPHER Center Fish Tank Live Stream</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #15202b;
      --muted: #5b6b7a;
      --line: #e2e6ea;
      --accent: #1f7a8c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --panel: #161c23;
        --ink: #e7edf3;
        --muted: #9fb0bf;
        --line: #26303a;
        --accent: #4fd1c5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header img.logo { height: 40px; width: auto; }
    nav { margin-left: auto; display: flex; gap: 1.25rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    nav a:hover { color: var(--accent); }
    main {
      max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem;
      display: grid; grid-template-columns: 2fr 1fr; gap: 1.25rem;
    }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 1rem; overflow: hidden;
    }
    .card h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    .card h2 { font-size: 1rem; margin: 0 0 0.5rem; color: var(--muted); }
    .stream-window img { width: 100%; height: auto; display: block; border-radius: 10px; }
  </style>
</head>
<body>
  <header>
    <a href="https://web.uri.edu/cypher/">
      <img class="logo" src="{{ url_for('static', filename='images/Cypher.jpg') }}" alt="CYPHER Center">
    </a>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h1 id="fish-tank-live-stream">Fish Tank Live Stream</h1>
      <div class="stream-window">
        <img src="{{ url_for('video_feed') }}" alt="Live stream">
      </div>
    </section>

    <aside class="card">
      <h2>Live Analysis</h2>
      <p>YOLOv8 fish detection overlays will render here.</p>
    </aside>
  </main>
</body>
</html>
